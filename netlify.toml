# SambaPay institutional site (static). Brain repo stays in Git; only dist/site is published.
[build]
  command = "npm ci && npm run build:site"
  publish = "dist/site"

[build.environment]
  NODE_VERSION = "22"

# EN at / ; PT at /pt/. Netlify serves pt/index.html and adds the trailing
# slash on its own. A forced /pt -> /pt/ rule matches its own target and loops.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

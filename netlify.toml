# SambaPay institutional site (static). Brain repo stays in Git; only dist/site is published.
[build]
  command = "npm ci && npm run build:site"
  publish = "dist/site"

[build.environment]
  NODE_VERSION = "22"

# EN at / ; PT at /pt/
[[redirects]]
  from = "/pt"
  to = "/pt/"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
